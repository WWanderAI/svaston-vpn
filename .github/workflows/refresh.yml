name: refresh-sub

# Обновляем набор нод по расписанию + вручную.
# Читает ПУБЛИЧНЫЙ канал через t.me/s/<имя> — не нужны api_id/api_hash/вход.
# ВАЖНО: оставь только schedule + workflow_dispatch. НЕ добавляй `on: push`
# (иначе пуш в тот же репо перезапустит сам себя).
on:
  schedule:
    - cron: "0 * * * *"   # каждый час
  workflow_dispatch:
    inputs:
      max_age:
        description: "Брать сообщения за последние N часов (0 = без отсечки)"
        required: false
        default: "24"
      lookback:
        description: "Предельное число сообщений при сканировании (страховка)"
        required: false
        default: "300"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install Hysteria2 liveness client
        env:
          HY2_RELEASE: "app/v2.13.0"
          HY2_SHA256: "907ba8c9693edb104b20582681fb7dc15639d5b64a9cbb616a7b539190a86691"
        run: |
          curl --retry 3 -fsSL "https://github.com/HyNetworks/hysteria/releases/download/${HY2_RELEASE}/hysteria-linux-amd64" -o "$RUNNER_TEMP/hysteria"
          echo "$HY2_SHA256  $RUNNER_TEMP/hysteria" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hysteria"
          echo "HYSTERIA_BIN=$RUNNER_TEMP/hysteria" >> "$GITHUB_ENV"

      - name: Resolve channel
        env:
          CHANNEL: ${{ secrets.TG_CHANNEL || 'halyava_vpnz' }}
        run: |
          [ -n "$CHANNEL" ] || { echo "Канал не задан (секрет TG_CHANNEL или дефолт в workflow)"; exit 1; }
          echo "TG_CHANNEL=$CHANNEL"

      - name: Scrape channel + build + push to repo
        env:
          TG_CHANNEL: ${{ secrets.TG_CHANNEL || 'halyava_vpnz' }}
          SUB_FETCH_MAX: "20"
          GH_REPO: ${{ secrets.GH_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MAX_AGE="${{ github.event.inputs.max_age || '24' }}"
          LOOKBACK="${{ github.event.inputs.lookback || '300' }}"
          python main.py --push --max-age "$MAX_AGE" --lookback "$LOOKBACK"

name: refresh-sub

# Публикуем только фиксированный список manual_nodes.txt.
# Telegram и сторонние GitHub-фиды в этом workflow не читаются.
# ВАЖНО: оставь только schedule + workflow_dispatch. НЕ добавляй `on: push`
# (иначе пуш в тот же репо перезапустит workflow сам себя).
on:
  schedule:
    - cron: "0 * * * *"   # проверяем список каждый час
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install Hysteria2 liveness client
        env:
          HY2_RELEASE: "app/v2.13.0"
          HY2_SHA256: "907ba8c9693edb104b20582681fb7dc15639d5b64a9cbb616a7b539190a86691"
        run: |
          curl --retry 3 -fsSL "https://github.com/HyNetworks/hysteria/releases/download/${HY2_RELEASE}/hysteria-linux-amd64" -o "$RUNNER_TEMP/hysteria"
          echo "$HY2_SHA256  $RUNNER_TEMP/hysteria" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hysteria"
          echo "HYSTERIA_BIN=$RUNNER_TEMP/hysteria" >> "$GITHUB_ENV"

      - name: Install Xray protocol liveness client
        env:
          XRAY_RELEASE: "v26.3.27"
          XRAY_SHA256: "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae"
        run: |
          curl --retry 3 -fsSL "https://github.com/XTLS/Xray-core/releases/download/${XRAY_RELEASE}/Xray-linux-64.zip" -o "$RUNNER_TEMP/xray.zip"
          echo "$XRAY_SHA256  $RUNNER_TEMP/xray.zip" | sha256sum -c -
          python3 - <<'PY'
          import os, zipfile
          z = zipfile.ZipFile(os.path.join(os.environ["RUNNER_TEMP"], "xray.zip"))
          with z.open("xray") as source, open(os.path.join(os.environ["RUNNER_TEMP"], "xray"), "wb") as target:
              target.write(source.read())
          PY
          chmod +x "$RUNNER_TEMP/xray"
          echo "XRAY_BIN=$RUNNER_TEMP/xray" >> "$GITHUB_ENV"

      - name: Build fixed subscription + push to repo
        env:
          MANUAL_NODES_FILE: "manual_nodes.txt"
          LIVENESS_MAX: "8"
          LIVENESS_TIMEOUT: "8"
          HY2_CHECK_TIMEOUT: "10"
          LIVENESS_WORKERS: "8"
          PING_MAX_MS: "800"
          PING_MARGIN_MS: "600"
          GH_REPO: ${{ secrets.GH_REPO || github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python main.py --push

name: generate-warp

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  warp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register free Cloudflare WARP via wgcf & save out/warp.conf
        run: |
          curl -fsSL "https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64" -o wgcf
          chmod +x wgcf
          ./wgcf register --accept-tos
          ./wgcf generate
          mkdir -p out
          cp wgcf-profile.conf out/warp.conf
          rm -f wgcf wgcf-account.toml wgcf-profile.conf

      - name: Commit and push out/warp.conf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/warp.conf
          git diff --cached --quiet || git commit -m "chore: generate free Cloudflare WARP config (out/warp.conf)"
          git push
